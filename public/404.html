<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dr. Shashi's Ortho Clinic</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect fix for React Router
      // Redirect to index.html preserving the path
      var segmentCount = 1; // number of path segments in repo name
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
